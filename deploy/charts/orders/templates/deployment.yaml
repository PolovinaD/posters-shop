apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
spec:
  # No `replicas` here on purpose: templates/hpa.yaml owns the replica count
  # (minReplicas: 2, maxReplicas: 5) and this chart always installs it. Setting
  # replicas here means every `helm upgrade` writes the chart's value back onto
  # the Deployment, scaling down, after which the HPA scales straight back up --
  # an avoidable scale-down/scale-up churn on every deploy. On a first install
  # Kubernetes defaults to 1 and the HPA immediately raises it to minReplicas.
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
        - name: orders
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
{{ toYaml .Values.env | indent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
{{ toYaml .Values.resources | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  labels:
    app: orders
spec:
  type: ClusterIP
  selector:
    app: orders
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
