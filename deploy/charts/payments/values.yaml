image:
  # Override with: --set image.repository=$ECR_REGISTRY/payments
  repository: YOUR_ECR_REGISTRY/payments
  tag: "latest"
replicaCount: 1

service:
  port: 80
  targetPort: 8000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

env:
  - name: SERVICE_NAME
    value: "payments"
  - name: JWT_SECRET
    valueFrom:
      secretKeyRef:
        name: postershop-jwt
        key: JWT_SECRET
  - name: LOG_LEVEL
    value: "INFO"
  - name: ROOT_PATH
    value: "/api/payments"
  - name: STRIPE_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: postershop-stripe
        key: SECRET_KEY
  - name: STRIPE_WEBHOOK_SECRET
    valueFrom:
      secretKeyRef:
        name: postershop-stripe
        key: WEBHOOK_SECRET
  # FRONTEND_URL is NOT listed here. It is rendered from the `frontendUrl:`
  # scalar at the bottom of this file — see the comment there for why.
  - name: CORS_ORIGINS
    value: "http://localhost:3000"
  # Ethereum escrow (phase 8). ESCROW_RPC_URL is the in-cluster ganache Service; ESCROW_PUBLIC_RPC_URL is
  # what the browser uses (the frontend's nginx proxies /rpc to ganache). The owner key comes from the
  # postershop-escrow Secret (ExternalSecret <- Secrets Manager postershop/escrow) and MUST be STABLE:
  # a rotated owner key orphans every in-flight OrderEscrow contract (nobody can bind, release or cancel it).
  - name: ESCROW_RPC_URL
    value: "http://ganache:8545"
  - name: ESCROW_PUBLIC_RPC_URL
    value: "/rpc"
  - name: ESCROW_OWNER_PRIVATE_KEY
    valueFrom:
      secretKeyRef:
        name: postershop-escrow
        key: OWNER_PRIVATE_KEY
  - name: WEI_PER_USD
    value: "1000000000000000"
  - name: ESCROW_COURIER_SHARE_BPS
    value: "2000"
  - name: ESCROW_OWNER_MIN_BALANCE_ETH
    value: "10"
  - name: ESCROW_EXPOSE_DEMO_ACCOUNTS
    value: "true"

ingress:
  enabled: false

# Public base URL the customer's browser is sent back to after Stripe checkout
# (services/payments/main.py builds success_url/cancel_url from it).
#
# This is the ALB hostname, and the ALB hostname CHANGES every time the cluster
# is re-raised — so it MUST NOT be hardcoded here. It was, once (afbc972), and
# the result was that every `helm upgrade` of payments restored a hostname from
# a long-dead cluster and silently redirected paying customers to nothing.
#
# Empty is the correct committed value: the Deployment then renders no
# FRONTEND_URL at all and the service falls back to its own default
# (services/payments/main.py). The deploy path fills the real value in at
# upgrade time from the LIVE `frontend` ingress, via
# deploy/lib/live-config.sh -> build_helm_config_args, which both
# deploy/deploy.sh and .github/workflows/deploy.yaml call.
#
# Set it explicitly only to override that lookup:
#   --set frontendUrl=http://my-alb.example.com
frontendUrl: ""

