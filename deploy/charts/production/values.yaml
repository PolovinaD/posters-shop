image:
  # Override with: --set image.repository=$ECR_REGISTRY/production
  repository: YOUR_ECR_REGISTRY/production
  tag: "latest"

# No replicaCount: the replica count is governed by templates/hpa.yaml
# (minReplicas: 1, maxReplicas: 5), not by this file. A key here would be an
# authoritative-looking knob that changes nothing.

service:
  port: 80
  targetPort: 8000

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: 300m
    memory: 384Mi

env:
  - name: SERVICE_NAME
    value: "production"
  - name: JWT_SECRET
    valueFrom:
      secretKeyRef:
        name: postershop-jwt
        key: JWT_SECRET
  - name: LOG_LEVEL
    value: "INFO"
  - name: ROOT_PATH
    value: "/api/production"
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: postershop-db
        key: DATABASE_URL_PRODUCTION
  - name: ORDERS_SERVICE_URL
    value: "http://orders"
  - name: LOGISTICS_SERVICE_URL
    value: "http://logistics"
  - name: CORS_ORIGINS
    value: "http://localhost:3000"

ingress:
  enabled: false

# No autoscaling block: the HPA is governed by templates/hpa.yaml
# (minReplicas: 1, maxReplicas: 5, CPU target 50%), not by this file. The keys
# that used to sit here were read by no template, and one of them claimed a 70%
# CPU target the cluster never ran — an authoritative-looking knob that changes
# nothing is worse than no knob at all.

migrations:
  enabled: true
  secretName: postershop-db
  secretKey: DATABASE_URL_PRODUCTION

