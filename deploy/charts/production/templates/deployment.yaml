apiVersion: apps/v1
kind: Deployment
metadata:
  name: production
spec:
  # No `replicas` here on purpose: templates/hpa.yaml owns the replica count
  # (minReplicas: 1, maxReplicas: 5) and this chart always installs it. Unlike
  # orders this does not churn at rest, because 1 == minReplicas -- it bites
  # under load. If the CPU HPA has scaled production out to several pods, a
  # `helm upgrade` writes replicas back to 1 and kills the extra pods
  # mid-workload, and the HPA then has to scale up again from scratch. This is
  # the CPU-bound service, so a deploy is most likely to land exactly then.
  selector:
    matchLabels:
      app: production
  template:
    metadata:
      labels:
        app: production
    spec:
      containers:
        - name: production
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
{{ toYaml .Values.env | indent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
{{ toYaml .Values.resources | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: production
  labels:
    app: production
spec:
  type: ClusterIP
  selector:
    app: production
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
