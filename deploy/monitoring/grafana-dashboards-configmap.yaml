apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-postershop-orders
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "PosterShop"
data:
  postershop-orders.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "type": "row",
          "title": "Order Overview",
          "gridPos": {"x": 0, "y": 0, "w": 24, "h": 1},
          "collapsed": false
        },
        {
          "type": "stat",
          "title": "Orders Created (24h)",
          "targets": [
            {"expr": "sum(increase(orders_created_total[24h]))", "legendFormat": "Orders"}
          ],
          "fieldConfig": {
            "defaults": {"color": {"mode": "palette-classic"}, "unit": "short"}
          },
          "gridPos": {"x": 0, "y": 1, "w": 6, "h": 4}
        },
        {
          "type": "stat",
          "title": "Pending Orders",
          "targets": [
            {"expr": "max(orders_by_status{status=\"created\"})", "legendFormat": "Pending"}
          ],
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 10},
                  {"color": "red", "value": 50}
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": {"x": 6, "y": 1, "w": 6, "h": 4}
        },
        {
          "type": "stat",
          "title": "Paid Orders",
          "targets": [
            {"expr": "max(orders_by_status{status=\"paid\"})", "legendFormat": "Paid"}
          ],
          "fieldConfig": {
            "defaults": {"color": {"mode": "palette-classic"}, "unit": "short"}
          },
          "gridPos": {"x": 12, "y": 1, "w": 6, "h": 4}
        },
        {
          "type": "stat",
          "title": "Reservation Failures (1h)",
          "targets": [
            {"expr": "sum(increase(inventory_reservation_failures_total[1h]))", "legendFormat": "Failures"}
          ],
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 5},
                  {"color": "red", "value": 20}
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": {"x": 18, "y": 1, "w": 6, "h": 4}
        },
        {
          "type": "row",
          "title": "Order Flow",
          "gridPos": {"x": 0, "y": 5, "w": 24, "h": 1},
          "collapsed": false
        },
        {
          "type": "timeseries",
          "title": "Orders by Status Over Time",
          "targets": [
            {"expr": "max by (status) (orders_by_status)", "legendFormat": "{{status}}"}
          ],
          "fieldConfig": {
            "defaults": {"color": {"mode": "palette-classic"}, "unit": "short"}
          },
          "options": {"legend": {"displayMode": "table", "placement": "right"}},
          "gridPos": {"x": 0, "y": 6, "w": 12, "h": 10}
        },
        {
          "type": "timeseries",
          "title": "Order Creation Rate",
          "targets": [
            {"expr": "rate(orders_created_total[5m]) * 60", "legendFormat": "Orders/min"}
          ],
          "fieldConfig": {
            "defaults": {"color": {"mode": "palette-classic"}, "unit": "opm"}
          },
          "gridPos": {"x": 12, "y": 6, "w": 12, "h": 10}
        },
        {
          "type": "row",
          "title": "Order Values",
          "gridPos": {"x": 0, "y": 16, "w": 24, "h": 1},
          "collapsed": false
        },
        {
          "type": "histogram",
          "title": "Order Amount Distribution",
          "targets": [
            {"expr": "sum(increase(order_total_amount_bucket[1h])) by (le)", "legendFormat": "{{le}}"}
          ],
          "fieldConfig": {
            "defaults": {"color": {"mode": "palette-classic"}, "unit": "currencyUSD"}
          },
          "gridPos": {"x": 0, "y": 17, "w": 12, "h": 8}
        },
        {
          "type": "timeseries",
          "title": "Reservation Failures by Reason",
          "targets": [
            {"expr": "rate(inventory_reservation_failures_total[5m]) * 60", "legendFormat": "{{reason}}"}
          ],
          "fieldConfig": {
            "defaults": {"color": {"mode": "palette-classic"}, "unit": "short"}
          },
          "gridPos": {"x": 12, "y": 17, "w": 12, "h": 8}
        },
        {
          "type": "row",
          "title": "Service Performance",
          "gridPos": {"x": 0, "y": 25, "w": 24, "h": 1},
          "collapsed": false
        },
        {
          "type": "timeseries",
          "title": "Orders Service Request Rate",
          "targets": [
            {"expr": "sum(rate(http_requests_total{service=\"orders\"}[5m])) by (path)", "legendFormat": "{{path}}"}
          ],
          "fieldConfig": {
            "defaults": {"color": {"mode": "palette-classic"}, "unit": "reqps"}
          },
          "gridPos": {"x": 0, "y": 26, "w": 12, "h": 8}
        },
        {
          "type": "timeseries",
          "title": "Orders Service Latency",
          "targets": [
            {"expr": "histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket{service=\"orders\"}[5m])) by (le)) * 1000", "legendFormat": "P50"},
            {"expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{service=\"orders\"}[5m])) by (le)) * 1000", "legendFormat": "P95"},
            {"expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{service=\"orders\"}[5m])) by (le)) * 1000", "legendFormat": "P99"}
          ],
          "fieldConfig": {
            "defaults": {"color": {"mode": "palette-classic"}, "unit": "ms"}
          },
          "gridPos": {"x": 12, "y": 26, "w": 12, "h": 8}
        },
        {
          "type": "row",
          "title": "Logs (Loki)",
          "gridPos": {"x": 0, "y": 34, "w": 24, "h": 1},
          "collapsed": false
        },
        {
          "type": "logs",
          "title": "Orders Logs (filter by correlation_id in Loki Explore)",
          "description": "Structured log lines from the orders service. To trace one request: use Loki Explore with query {job=\"postershop\", correlation_id=\"<your-id>\"} — correlation_id is a promoted stream label, so it goes inside the selector rather than in a | json filter.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "datasource": {"type": "loki", "uid": "loki"},
              "expr": "{job=\"postershop\", service=\"orders\"} | json | line_format \"{{.message}}\"",
              "legendFormat": ""
            }
          ],
          "options": {
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true,
            "enableLogDetails": true,
            "prettifyLogMessage": false
          },
          "gridPos": {"x": 0, "y": 35, "w": 24, "h": 10}
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": ["postershop", "orders"],
      "time": {"from": "now-1h", "to": "now"},
      "timezone": "browser",
      "title": "PosterShop Orders",
      "uid": "postershop-orders",
      "version": 2
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-postershop-bulkhead
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "PosterShop"
data:
  postershop-bulkhead.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "orders – bulkhead: in flight vs queued (sum over pods)",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 9
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 15
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(bulkhead_in_flight{exported_service=\"orders\"})",
              "legendFormat": "in flight"
            },
            {
              "refId": "B",
              "expr": "sum(bulkhead_queued{exported_service=\"orders\"})",
              "legendFormat": "queued"
            },
            {
              "refId": "C",
              "expr": "8 * kube_deployment_status_replicas_ready{namespace=\"postershop\",deployment=\"orders\"}",
              "legendFormat": "limit (8 × replicas)"
            }
          ],
          "description": "Requests inside the orders service's per-process bulkhead, summed over pods. `in flight` can never exceed the limit (pool_size + max_overflow = 8 per pod, so 8 × ready replicas); `queued` requests wait on the event loop for up to BULKHEAD_QUEUE_TIMEOUT (10 s) and cost no thread and no DB connection. Split by exported_service: the scrape attaches its own `service` label, so the application's label surfaces as `exported_service`."
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "catalog – bulkhead: in flight vs queued (sum over pods)",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 9
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 15
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(bulkhead_in_flight{exported_service=\"catalog\"})",
              "legendFormat": "in flight"
            },
            {
              "refId": "B",
              "expr": "sum(bulkhead_queued{exported_service=\"catalog\"})",
              "legendFormat": "queued"
            },
            {
              "refId": "C",
              "expr": "10 * kube_deployment_status_replicas_ready{namespace=\"postershop\",deployment=\"catalog\"}",
              "legendFormat": "limit (10 × replicas)"
            }
          ],
          "description": "Same for catalog (limit 10 per pod). A flat `in flight` at the limit with a growing `queued` line is the signature of a CPU-bound service at capacity — the lever is replicas, not the bulkhead."
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "bulkhead rejections (503 + Retry-After) per second, by service",
          "gridPos": {
            "x": 0,
            "y": 9,
            "w": 12,
            "h": 9
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (exported_service) (rate(bulkhead_rejected_total[1m]))",
              "legendFormat": "{{exported_service}}"
            }
          ],
          "description": "Requests the bulkhead answered with 503 + Retry-After because the queue wait exceeded BULKHEAD_QUEUE_TIMEOUT. Zero while the queue absorbs a burst; a plateau means sustained overload (2026-09-19: catalog ≈ 9/s at 200 clients with one replica, orders ≈ 7/s at 200 clients)."
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "orders – request rate (HPA signal) and ready replicas",
          "gridPos": {
            "x": 12,
            "y": 9,
            "w": 12,
            "h": 9
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              },
              "unit": "reqps"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "ready replicas"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "short"
                  },
                  {
                    "id": "custom.axisPlacement",
                    "value": "right"
                  },
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        10,
                        10
                      ]
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_requests_total{namespace=\"postershop\",exported_service=\"orders\"}[2m]))",
              "legendFormat": "requests/s (all orders pods)"
            },
            {
              "refId": "B",
              "expr": "kube_deployment_status_replicas_ready{namespace=\"postershop\",deployment=\"orders\"}",
              "legendFormat": "ready replicas"
            }
          ],
          "description": "The orders HPA signal (http_requests_total rate, target 5 req/s per pod) against the ready replica count from kube-state-metrics; replicas lag the load by the HPA's sync period plus pod start-up."
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": [
        "postershop",
        "bulkhead",
        "load"
      ],
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "timezone": "browser",
      "title": "PosterShop Bulkhead",
      "uid": "postershop-bulkhead",
      "version": 1
    }
