                  },
                  {"id": "custom.lineWidth", "value": 2}
                ]
              },
              {
                "matcher": {"id": "byName", "options": "Min Replicas"},
                "properties": [
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dot",
                      "dash": [0, 8]
                    }
                  },
                  {"id": "custom.lineWidth", "value": 2}
                ]
              },
              {
                "matcher": {"id": "byName", "options": "Max Replicas"},
                "properties": [
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [12, 6]
                    }
                  },
                  {"id": "custom.lineWidth", "value": 2}
                ]
              }
            ]
          },
          "gridPos": {"x": 12, "y": 0, "w": 12, "h": 10}
        },
        {
          "type": "timeseries",
          "title": "Orders — Request Rate req/s (HPA Signal)",
          "description": "HTTP request rate to orders service driving the custom metric HPA. Target: 5 req/s per pod.",
