apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-postershop-hpa-comparison
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "PosterShop"
data:
  postershop-hpa-comparison.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "type": "timeseries",
          "title": "Production — CPU Utilization % (HPA Signal)",
          "description": "CPU usage driving the production CPU-based HPA. Target: 50% average utilization.",
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"postershop\", pod=~\"production-.*\"}[2m])) by (pod) / sum(kube_pod_container_resource_requests{namespace=\"postershop\", pod=~\"production-.*\", resource=\"cpu\"}) by (pod) * 100",
              "legendFormat": "{{pod}} CPU %"
            },
            {
              "expr": "scalar(kube_horizontalpodautoscaler_spec_target_metric{horizontalpodautoscaler=\"production-hpa\", namespace=\"postershop\", metric_name=\"cpu\"})",
              "legendFormat": "HPA Target (50%)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "color": {"mode": "palette-classic"},
              "min": 0,
              "custom": {"axisLabel": "CPU utilization (%)", "lineWidth": 1}
            },
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "HPA Target (50%)"},
                "properties": [
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [12, 6]
                    }
                  },
                  {"id": "custom.lineWidth", "value": 2}
                ]
              }
            ]
          },
          "gridPos": {"x": 0, "y": 0, "w": 12, "h": 10}
        },
        {
          "type": "timeseries",
          "title": "Production — Replica Count (CPU HPA Response)",
          "description": "How the CPU-based HPA adjusts production replicas in response to CPU load.",
