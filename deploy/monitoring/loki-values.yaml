# ============================================================
# Loki Helm Values for PosterShop
# ============================================================
# Lightweight log aggregation with Grafana Loki.
# 
# Install:
#   helm repo add grafana https://grafana.github.io/helm-charts
#   helm install loki grafana/loki -n monitoring -f loki-values.yaml
# ============================================================

# Single binary mode (simplest deployment)
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  
  commonConfig:
    replication_factor: 1
  
  storage:
    type: filesystem
  
  schemaConfig:
    configs:
      - from: 2024-01-01
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  limits_config:
    retention_period: 168h  # 7 days
    ingestion_rate_mb: 10
    ingestion_burst_size_mb: 20
    max_query_series: 5000
    max_entries_limit_per_query: 10000
    # Backstop against unbounded query fan-out. Loki's default is 2,000,000 chunks
    # (flag store.query-chunk-limit) — effectively no ceiling, so one wide-range query
    # can pull more chunks into memory than the container allows and take the process
    # down (observed 2026-08-17: loki-0 OOMKilled twice, HTTP 502 while it cycled).
    # max_entries_limit_per_query above does NOT protect against this — the query that
    # killed the pod asked for 5000 entries, well under that 10000 ceiling. That knob
    # bounds the RESPONSE; Loki still decompresses every matching chunk before applying
    # it. Chunks are the memory-proportional unit, so chunks are what we cap.
    # 2000 is a crash guard, not a throttle: it converts an OOMKill (Loki gone, every
    # dashboard 502s, restart loop) into one failed query — "maximum number of chunks
    # exceeded" — with the process still serving everyone else. That trade is deliberate.
    #
    # Read this before changing the number. Fluent Bit still promotes the per-request
    # correlation_id to a Loki stream label (fluent-bit-values.yaml, Label_Keys), so
    # every HTTP request opens its own stream and therefore its own chunk. Chunk count
    # here tracks REQUEST COUNT, not log volume. Two consequences:
    #   - A pinned query, {job="postershop", correlation_id="<id>"}, reads a single
    #     stream and is nowhere near this cap. Unaffected.
    #   - A broad query, {job="postershop"} over hours, can pass 2000 chunks on traffic
    #     alone and will now fail fast instead of returning logs.
    # If a broad query you genuinely need hits the cap, narrow its time range first.
    # Only if that is not enough, raise this — and watch `kubectl top pod loki-0`
    # against the 1Gi limit below while you do, because this cap is the thing standing
    # between a wide query and the OOM.
    max_chunks_per_query: 2000

  query_scheduler:
    max_outstanding_requests_per_tenant: 2048

singleBinary:
  replicas: 1
  
  # Raised from 256Mi/512Mi: loki-0 was OOMKilled twice on 2026-08-17 under a
  # Grafana-Explore-scale query (limit=5000 over a wide range), returning HTTP 502 while
  # it restarted. `kubectl top pod loki-0` measured 267Mi at IDLE — 52% of the old 512Mi
  # limit with nobody querying, leaving under ~245Mi for an entire query.
  # 1Gi leaves ~750Mi above that measured idle floor. The 512Mi request covers the
  # measured steady state, so the scheduler stops placing this as a 256Mi pod and Loki
  # is not first out under node pressure. cpu is unchanged: 22m measured at idle against
  # a 500m limit, so cpu was never the problem.
  # That 267Mi was measured with the per-request correlation_id still promoted to a Loki
  # stream label — i.e. against the index as it actually is today — so this sizing does
  # not assume that label ever goes away. It also will not shrink on its own: idle RSS
  # here tracks stream count, which grows with traffic. Re-measure if idle passes ~600Mi.
  # Node budget checked before choosing: 2x t3.large, ~7.1Gi allocatable each.
  # Memory requests 29%/32% -> ~33%/36%. Memory limits 77%/79% -> ~84%/86%.
  # Still inside capacity, so this is a container ceiling, not node pressure.
  # 1.5Gi was considered and rejected — it puts node memory limits at ~91-93%.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  
  persistence:
    enabled: true
    size: 10Gi
    storageClass: gp2

# Disable components not needed in single binary mode
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

gateway:
  enabled: true
  replicas: 1
  
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

# Disable memory-hungry caches — default memcached chunks/results cache requests ~9.6Gi
# which exceeds t3.large node capacity. Not needed for thesis-scale log volume.
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# Monitoring
monitoring:
  selfMonitoring:
    enabled: false
  lokiCanary:
    enabled: false

# Test disabled
test:
  enabled: false
