services:
  postgres:
    image: postgres:16
    container_name: postershop-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rootpass}
      POSTGRES_DB: ${POSTGRES_DB:-postershop}
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-root} -d ${POSTGRES_DB:-postershop}"]
      interval: 2s
      timeout: 5s
      retries: 10

  users-migrate:
    build: ./services/users
    container_name: users-migrate
    command: alembic upgrade head
    restart: "no"
    environment:
      DATABASE_URL: postgresql://users_svc:users_pass@postgres:5432/${POSTGRES_DB}?options=-csearch_path%3Dusers_schema
    depends_on:
      postgres:
        condition: service_healthy

  users:
    build: ./services/users
    container_name: users
    environment:
      DATABASE_URL: postgresql://users_svc:users_pass@postgres:5432/${POSTGRES_DB}?options=-csearch_path%3Dusers_schema
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_prod}
      SERVICE_NAME: users
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      users-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "8001:8000"

  catalog-migrate:
    build: ./services/catalog
    container_name: catalog-migrate
    command: alembic upgrade head
    restart: "no"
    environment:
      DATABASE_URL: postgresql://catalog_svc:catalog_pass@postgres:5432/${POSTGRES_DB}?options=-csearch_path%3Dcatalog_schema
    depends_on:
      postgres:
        condition: service_healthy

  catalog:
    build: ./services/catalog
    container_name: catalog
    environment:
      DATABASE_URL: postgresql://catalog_svc:catalog_pass@postgres:5432/${POSTGRES_DB}?options=-csearch_path%3Dcatalog_schema
      INVENTORY_SERVICE_URL: http://inventory:8000
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_prod}
      SERVICE_NAME: catalog
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      catalog-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      inventory:
        condition: service_started
    ports:
      - "8002:8000"

  orders-migrate:
    build: ./services/orders
    container_name: orders-migrate
    command: alembic upgrade head
    restart: "no"
    environment:
      DATABASE_URL: postgresql://orders_svc:orders_pass@postgres:5432/${POSTGRES_DB}?options=-csearch_path%3Dorders_schema
    depends_on:
      postgres:
        condition: service_healthy

  orders:
    build: ./services/orders
    container_name: orders
    environment:
      DATABASE_URL: postgresql://orders_svc:orders_pass@postgres:5432/${POSTGRES_DB}?options=-csearch_path%3Dorders_schema
      INVENTORY_SERVICE_URL: http://inventory:8000
      CATALOG_SERVICE_URL: http://catalog:8000
      PRODUCTION_SERVICE_URL: http://production:8000
      PAYMENT_SERVICE_URL: http://payments:8000
      NOTIFICATIONS_SERVICE_URL: http://notifications:8000
      DESIGNS_SERVICE_URL: http://designs:8000
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_prod}
      SERVICE_NAME: orders
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      CB_FAILURE_THRESHOLD: ${CB_FAILURE_THRESHOLD:-5}
      CB_RECOVERY_TIMEOUT: ${CB_RECOVERY_TIMEOUT:-30}
      ESCROW_RECONCILE_INTERVAL: ${ESCROW_RECONCILE_INTERVAL:-15}
    depends_on:
      orders-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      inventory:
        condition: service_started
      catalog:
        condition: service_started
      payments:
        condition: service_started
    ports:
      - "8003:8000"

  production-migrate:
    build: ./services/production
    container_name: production-migrate
    command: alembic upgrade head
    restart: "no"
    environment:
      DATABASE_URL: postgresql://production_svc:production_pass@postgres:5432/${POSTGRES_DB}?options=-csearch_path%3Dproduction_schema
    depends_on:
      postgres:
        condition: service_healthy

  production:
    build: ./services/production
    container_name: production
    environment:
      DATABASE_URL: postgresql://production_svc:production_pass@postgres:5432/${POSTGRES_DB}?options=-csearch_path%3Dproduction_schema
      ORDERS_SERVICE_URL: http://orders:8000
      LOGISTICS_SERVICE_URL: http://logistics:8000
      SERVICE_NAME: production
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_prod}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      production-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      logistics:
        condition: service_started
    ports:
      - "8004:8000"

  logistics-migrate:
    build: ./services/logistics
    container_name: logistics-migrate
    command: alembic upgrade head
    restart: "no"
    environment:
      DATABASE_URL: postgresql://logistics_svc:logistics_pass@postgres:5432/${POSTGRES_DB}?options=-csearch_path%3Dlogistics_schema
    depends_on:
      postgres:
        condition: service_healthy

  logistics:
    build: ./services/logistics
    container_name: logistics
    environment:
      DATABASE_URL: postgresql://logistics_svc:logistics_pass@postgres:5432/${POSTGRES_DB}?options=-csearch_path%3Dlogistics_schema
      ORDERS_SERVICE_URL: http://orders:8000
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_prod}
      SERVICE_NAME: logistics
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LOGISTICS_DEFAULT_COURIER_WALLET: ${LOGISTICS_DEFAULT_COURIER_WALLET:-0x22d491bde2303f2f43325b2108d26f1eaba1e32b}  # Ganache account[2]: the unattended worker's courier
    depends_on:
      logistics-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "8005:8000"

  inventory-migrate:
    build: ./services/inventory
    container_name: inventory-migrate
    command: alembic upgrade head
    restart: "no"
    environment:
      DATABASE_URL: postgresql://inventory_svc:inventory_pass@postgres:5432/${POSTGRES_DB}?options=-csearch_path%3Dinventory_schema
    depends_on:
      postgres:
        condition: service_healthy

  inventory:
    build: ./services/inventory
    container_name: inventory
    environment:
      DATABASE_URL: postgresql://inventory_svc:inventory_pass@postgres:5432/${POSTGRES_DB}?options=-csearch_path%3Dinventory_schema
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_prod}
      SERVICE_NAME: inventory
      ORDERS_SERVICE_URL: http://orders:8000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      inventory-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "8006:8000"

  # ============================================
  # Ganache — local Ethereum simulator for the escrow payment (phase 8)
  # ============================================
  ganache:
    image: trufflesuite/ganache:v7.9.2
    container_name: ganache
    # Deterministic wallet => the ten well-known accounts (payments serves their keys as demo accounts);
    # chainId 1337; the chain is persisted on the volume so deployed contracts survive restarts.
    command: ["--wallet.deterministic", "--chain.chainId", "1337", "--server.host", "0.0.0.0", "--database.dbPath", "/data"]
    # The one service not on restart "no": the chain lives on the ganache-data volume, so a revived node keeps
    # every deployed contract. A frontend image build OOM-killed it (exit 137) on the 2 GB Docker VM on 2026-09-17.
    restart: on-failure
    volumes:
      - ganache-data:/data
    ports:
      - "8545:8545"
    healthcheck:
      # The image has node but no wget/curl: a one-line JSON-RPC eth_chainId probe.
      test: ["CMD", "node", "-e", "require('http').request({host:'127.0.0.1',port:8545,method:'POST',headers:{'Content-Type':'application/json'}},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1)).end('{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_chainId\",\"params\":[]}')"]
      interval: 5s
      timeout: 3s
      retries: 12

  payments:
    build: ./services/payments
    container_name: payments
    environment:
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      SERVICE_NAME: payments
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_prod}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ESCROW_RPC_URL: http://ganache:8545
      ESCROW_PUBLIC_RPC_URL: ${ESCROW_PUBLIC_RPC_URL:-/rpc}
      # Fixed dev key so contracts keep their owner across restarts. Deliberately NOT a Ganache account:
      # payments tops it up from account 0 at startup, which exercises the IEP "fund the owner" step.
      ESCROW_OWNER_PRIVATE_KEY: ${ESCROW_OWNER_PRIVATE_KEY:-0x4c0883a69102937d6231471b5dbb6204fe5129617082792ae468d01a3f362318}
      WEI_PER_USD: ${WEI_PER_USD:-1000000000000000}
      ESCROW_COURIER_SHARE_BPS: ${ESCROW_COURIER_SHARE_BPS:-2000}
      ESCROW_OWNER_MIN_BALANCE_ETH: ${ESCROW_OWNER_MIN_BALANCE_ETH:-10}
      ESCROW_EXPOSE_DEMO_ACCOUNTS: ${ESCROW_EXPOSE_DEMO_ACCOUNTS:-true}
    depends_on:
      ganache:
        condition: service_healthy
    ports:
      - "8007:8000"

  notifications-migrate:
    build: ./services/notifications
    container_name: notifications-migrate
    command: alembic upgrade head
    restart: "no"
    environment:
      DATABASE_URL: postgresql://notifications_svc:notifications_pass@postgres:5432/${POSTGRES_DB}?options=-csearch_path%3Dnotifications_schema
    depends_on:
      postgres:
        condition: service_healthy

  notifications:
    build: ./services/notifications
    container_name: notifications
    environment:
      DATABASE_URL: postgresql://notifications_svc:notifications_pass@postgres:5432/${POSTGRES_DB}?options=-csearch_path%3Dnotifications_schema
      SERVICE_NAME: notifications
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_prod}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-logging}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@postershop.local}
      SES_REGION: ${SES_REGION:-eu-central-1}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      notifications-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "8009:8000"

  # Designs - AI poster studio (async generation worker; images on the designs-data volume)
  designs-migrate:
    build: ./services/designs
    container_name: designs-migrate
    command: alembic upgrade head
    restart: "no"
    environment:
      DATABASE_URL: postgresql://designs_svc:designs_pass@postgres:5432/${POSTGRES_DB}?options=-csearch_path%3Ddesigns_schema
    depends_on:
      postgres:
        condition: service_healthy

  designs:
    build: ./services/designs
    container_name: designs
    environment:
      DATABASE_URL: postgresql://designs_svc:designs_pass@postgres:5432/${POSTGRES_DB}?options=-csearch_path%3Ddesigns_schema
      SERVICE_NAME: designs
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_prod}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-fake}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-1.5}
      OPENAI_IMAGE_QUALITY: ${OPENAI_IMAGE_QUALITY:-medium}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:-}
      REPLICATE_MODEL: ${REPLICATE_MODEL:-black-forest-labs/flux-schnell}
      STORAGE_BACKEND: local
      DESIGNS_STORAGE_DIR: /data/images
      DESIGNS_PUBLIC_URL_PREFIX: /api/designs/images
      CATALOG_SERVICE_URL: http://catalog:8000
      INVENTORY_SERVICE_URL: http://inventory:8000
      AI_DAILY_QUOTA: ${AI_DAILY_QUOTA:-10}
      AI_POSTER_BASE_PRICE: ${AI_POSTER_BASE_PRICE:-29.99}
      AI_POSTER_STOCK: ${AI_POSTER_STOCK:-1000}
      DESIGNS_WORKER_POLL_INTERVAL: ${DESIGNS_WORKER_POLL_INTERVAL:-1.0}
      DESIGNS_MAX_ATTEMPTS: ${DESIGNS_MAX_ATTEMPTS:-3}
      DESIGNS_STALE_AFTER: ${DESIGNS_STALE_AFTER:-600}
      DESIGNS_SWEEP_INTERVAL: ${DESIGNS_SWEEP_INTERVAL:-60}
      CB_FAILURE_THRESHOLD: ${CB_FAILURE_THRESHOLD:-5}
      CB_RECOVERY_TIMEOUT: ${CB_RECOVERY_TIMEOUT:-30}
    volumes:
      - designs-data:/data/images
    depends_on:
      designs-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      catalog:
        condition: service_started
      inventory:
        condition: service_started
    ports:
      - "8010:8000"

  infra:
    build: ./services/infra
    container_name: infra
    environment:
      NAMESPACE: postershop
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_prod}
      SERVICE_NAME: infra
    ports:
      - "8008:8000"

  # ============================================
  # Frontend - Admin Dashboard
  # ============================================
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - users
      - catalog
      - orders
      - production
      - logistics
      - inventory
      - payments
      - designs
      - ganache
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  pgdata:
  ganache-data:
  designs-data:
